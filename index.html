function doQuery(){
var input=document.getElementById('cno').value.trim();
if(!input){document.getElementById('resultBody').innerHTML='<div class="no-data">'+t('noData')+'</div>';document.getElementById('titlePrefix').innerHTML='【】'+t('shipInfo');document.getElementById('titleTicket').innerHTML='';return}
var codes=input.split(/[\n,，\s;；]+/).filter(function(x){return x.trim()});
var found=[],notFound=[];
for(var i=0;i<codes.length;i++){var code=codes[i].trim(),data=orderData[code];if(data)found.push({code:code,data:data});else notFound.push(code)}
document.getElementById('titlePrefix').innerHTML='【'+t('batchQuery')+'】'+t('total')+codes.length+t('pieces');
document.getElementById('titleTicket').innerHTML=t('found')+found.length+t('pieces')+'，'+t('notFound')+notFound.length+t('pieces');
var html='';
if(!found.length){html='<div class="no-data">';for(var j=0;j<notFound.length;j++)html+=notFound[j]+' - '+t('notFoundMsg')+'<br>';html+='</div>'}
else{for(var n=0;n<found.length;n++){var d=found[n].data,code=found[n].code;html+='<div class="data-row"><div class="order-header">'+code+'</div><div class="order-info">';html+='<span><span class="label">'+t('refNo')+':</span> <span class="value">'+(d.refNo||'-')+'</span></span>';html+='<span><span class="label">'+t('trackNo')+':</span> <span class="value">'+d.trackNo+'</span></span>';html+='<span><span class="label">'+t('dest')+':</span> <span class="value">'+d.destination+'</span></span>';html+='<span><span class="label">'+t('localTime')+':</span> <span class="value">'+d.localTime+'</span></span>';html+='<span><span class="label">'+t('status')+':</span> <span class="value">'+d.status+'</span></span>';html+='<span><span class="label">'+t('receiver')+':</span> <span class="value">'+(d.receiver||'-')+'</span></span>';html+='</div>';if(d.receiverInfo){var ri=d.receiverInfo;html+='<div class="order-info" style="background:#fafafa"><span class="label">'+t('receiverInfo')+':</span> '+t('nome')+': '+ri.nome+' | '+t('pais')+': '+ri.pais+' | '+t('cidade')+': '+ri.cidade+' | '+t('rua')+': '+ri.rua+' | '+t('cep')+': '+ri.cep+' | '+t('tel')+': '+ri.telefone+'</div>'}if(d.records&&d.records.length){html+='<table class="track-table"><tr><th>'+t('time')+'</th><th>'+t('location')+'</th><th>'+t('desc')+'</th></tr>';for(var m=0;m<d.records.length;m++){var r=d.records[m];html+='<tr><td>'+r.time+'</td><td>'+r.location+'</td><td>'+r.desc+'</td></tr>'}html+='</table>'}html+='</div>'}if(notFound.length)html+='<div class="no-data" style="margin-top:5px">'+t('notFound')+'：'+notFound.join('、')+'</div>'}
document.getElementById('resultBody').innerHTML=html}
